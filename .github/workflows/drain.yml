# The email queue's worker, on a clock.
#
# A church presses send on four hundred people and closes the laptop. The copies
# are already written down as rows waiting their turn, and something has to come
# along and take them. The press itself does the first pass, so a message to
# three people arrives while somebody is looking at the screen; this is what
# finishes the rest, and what sends a message scheduled for Friday at nine.
#
# It lives here rather than in vercel.json because Vercel's Hobby plan runs a
# cron once a day, and a send queue drained once a day is not a send queue.
# Five minutes is the shortest GitHub offers, and it is far more often than a
# church of this size needs.
name: Drain the email queue

on:
  schedule:
    - cron: "*/5 * * * *"
  # So it can be run by hand while something is being tested.
  workflow_dispatch:

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Take whatever is waiting
        env:
          SECRET: ${{ secrets.CRON_SECRET }}
          SITE: ${{ vars.PLATFORM_URL || 'https://connectapp.church' }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::CRON_SECRET is not set, so the queue cannot be drained."
            exit 1
          fi
          code=$(curl -s -o /tmp/drain.json -w "%{http_code}" --max-time 300 \
            -H "Authorization: Bearer $SECRET" "$SITE/api/email/drain")
          echo "answered $code"
          cat /tmp/drain.json
          [ "$code" = "200" ]
