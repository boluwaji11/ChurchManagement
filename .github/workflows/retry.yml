# A failed run gets one more go before anybody is told.
#
# Most of what goes wrong here goes wrong once: a dropped connection to the
# database container, a registry that timed out, a runner that lost its disk.
# A check that cries wolf on those is a check people stop reading, and the one
# real failure then arrives in a column nobody looks at.
#
# One retry, of the failed jobs alone. A test that is genuinely broken fails
# twice and still says so.
name: Retry

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write

jobs:
  again:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    steps:
      - name: Run the failed jobs once more
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/actions/runs/$RUN_ID/rerun-failed-jobs"
