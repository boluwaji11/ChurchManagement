    <path d="M179 183c13 0 22 8 22 19 0 3 0 6-2 9-2-10-9-16-20-16s-18 6-20 16c-2-3-2-6-2-9 0-11 9-19 22-19Z" fill="#cacaca"/>
    <circle cx="179" cy="179" r="8" fill="#cacaca"/>
    <circle cx="172" cy="208" r="2" fill="#2f2e41"/>
    <circle cx="186" cy="208" r="2" fill="#2f2e41"/>
    <path d="M174 216c3 3 7 3 10 0" stroke="#2f2e41" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Him -->
  <g>
    <path d="M236 262l-10 42M290 262l10 40" stroke="#a0616a" stroke-width="11" stroke-linecap="round"/>
    <path d="M236 252c0-15 12-25 27-25s27 10 27 25v78h-54z" fill="#e6e6e6"/>
    <path d="M263 227v103" stroke="#cacaca" stroke-width="3"/>
    <path d="M240 330h16v68h-16zM270 330h16v68h-16z" fill="#2f2e41"/>
    <path d="M235 398h20v9h-20zM267 398h20v9h-20z" fill="#2d2a3f"/>
