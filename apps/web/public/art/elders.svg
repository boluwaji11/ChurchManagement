<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440" role="img">
  <!-- Two older members of the congregation, facing forward, held in a heart.
       Drawn here: the library's version is an embrace in profile, and no
       permissive set has older people standing and facing out. Same flat
       language and palette as the church and the gathering. -->
