    <circle cx="270" cy="212" r="2" fill="#2f2e41"/>
    <path d="M258 220c3 3 7 3 10 0" stroke="#2f2e41" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M300 300v98" stroke="#2d2a3f" stroke-width="6" stroke-linecap="round"/>
