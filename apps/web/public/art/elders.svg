  <path d="M220 418C66 326 24 226 66 164c36-54 114-52 154 10v244Z" fill="#2d2a3f" opacity=".14"/>

  <!-- Her -->
  <g>
    <path d="M152 258l-11 46M206 258l9 38" stroke="#ffb6b6" stroke-width="11" stroke-linecap="round"/>
    <path d="M152 248c0-14 11-23 27-23s27 9 27 23v74h-54z" fill="#f2f2f2"/>
    <path d="M156 322h46l-4 34h-38z" fill="#2f2e41"/>
