<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440" role="img" opacity="0.1">
  <!-- R24.4. The wash drawing.

     The same church the setup page carries, faded into the page's background
     layer so it sits under the product rather than beside it. The fade is in
     the file because a CSS background image has no opacity of its own, and the
     one place it can be set once for both apps is here. -->
  <!-- A church, drawn in the flat language of the rest of the set and on the
       same palette: our ink for the accent, #2f2e41 for the dark, the two greys
       unDraw uses for everything behind the subject. -->
  <ellipse cx="260" cy="406" rx="214" ry="14" fill="#f2f2f2"/>

  <!-- Trees behind -->
  <path d="M96 406V330" stroke="#2f2e41" stroke-width="7" stroke-linecap="round"/>
  <path d="M96 236c34 0 56 26 56 54s-22 48-56 48-56-20-56-48 22-54 56-54Z" fill="#e6e6e6"/>
  <path d="M430 406V342" stroke="#2f2e41" stroke-width="6" stroke-linecap="round"/>
  <path d="M430 262c28 0 46 22 46 46s-18 40-46 40-46-18-46-40 18-46 46-46Z" fill="#e6e6e6"/>

  <!-- Steeple -->
  <path d="M260 26l40 56h-80l40-56Z" fill="#514a95"/>
  <path d="M260 6v28M248 18h24" stroke="#2f2e41" stroke-width="7" stroke-linecap="round"/>
  <path d="M220 82h80v74h-80z" fill="#f2f2f2"/>
  <path d="M260 96c10 0 17 8 17 18v16h-34v-16c0-10 7-18 17-18Z" fill="#514a95"/>

  <!-- Nave -->
  <path d="M130 196l130-56 130 56v210H130z" fill="#514a95"/>
  <path d="M130 196l130-56 130 56-14 12-116-50-116 50-14-12Z" fill="#2f2e41"/>

  <!-- Door -->
  <path d="M236 406v-74c0-14 10-24 24-24s24 10 24 24v74h-48Z" fill="#2f2e41"/>
  <path d="M260 316v86" stroke="#f2f2f2" stroke-width="4" stroke-linecap="round"/>

  <!-- Windows -->
  <g fill="#f2f2f2">
    <path d="M172 268c8 0 14 6 14 15v37h-28v-37c0-9 6-15 14-15Z"/>
    <path d="M348 268c8 0 14 6 14 15v37h-28v-37c0-9 6-15 14-15Z"/>
    <path d="M172 206c8 0 13 5 13 13v23h-26v-23c0-8 5-13 13-13Z" opacity=".75"/>
    <path d="M348 206c8 0 13 5 13 13v23h-26v-23c0-8 5-13 13-13Z" opacity=".75"/>
  </g>

  <!-- Steps and path -->
  <path d="M214 406h92v-10h-92z" fill="#e6e6e6"/>
  <path d="M202 406h116v-20h-116z" fill="#ccc" opacity=".6"/>

  <!-- Two people walking up, on the lawn rather than against the wall -->
  <g>
    <circle cx="66" cy="310" r="17" fill="#ffb6b6"/>
    <path d="M66 291c11 0 18 6 18 15H48c0-9 7-15 18-15Z" fill="#2f2e41"/>
    <path d="M49 336h34v38H49z" fill="#514a95"/>
    <path d="M51 374h12l3 32h-13zM69 374h12l4 32H72z" fill="#2f2e41"/>
    <path d="M47 404h20v6H47zM68 404h20v6H68z" fill="#2d2a3f"/>
    <path d="M49 340l-9 30M83 340l9 30" stroke="#ffb6b6" stroke-width="9" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="106" cy="326" r="14" fill="#a0616a"/>
    <path d="M106 311c9 0 15 5 15 13H91c0-8 6-13 15-13Z" fill="#2f2e41"/>
    <path d="M92 348h28v32H92z" fill="#e6e6e6"/>
    <path d="M94 380h10l2 26h-11zM108 380h10l3 26h-11z" fill="#2f2e41"/>
    <path d="M90 404h17v6H90zM107 404h17v6h-17z" fill="#2d2a3f"/>
    <path d="M92 352l-7 24M120 352l7 24" stroke="#a0616a" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
